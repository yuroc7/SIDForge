<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Фактичний консольний екран SID Forge перед запуском</title>
  <desc id="desc">Підсумок із поточним і майбутнім SID та підтвердженням запуску</desc>
  <rect width="1280" height="760" fill="#0c0c0c"/>
  <rect width="1280" height="44" fill="#202020"/>
  <rect x="16" y="12" width="18" height="18" fill="none" stroke="#f2f2f2" stroke-width="2"/>
  <text x="48" y="29" fill="#f4f4f4" font-family="Segoe UI,Arial,sans-serif" font-size="16">SID Forge</text>
  <g fill="#f2f2f2" font-family="Cascadia Mono,Consolas,monospace" font-size="21">
    <text x="34" y="86">SID Forge автоматична зміна SID</text>
    <text x="34" y="116">===============================</text>
    <text x="34" y="165">Цей інструмент автоматично змінює SID поточної Windows.</text>
    <text x="34" y="195">Зміна виконується одноразовим SYSTEM-worker-ом.</text>
    <text x="34" y="225">Комп&apos;ютер може перезавантажитися один або два рази.</text>
    <text x="34" y="279">Підсумок зміни SID</text>
    <text x="34" y="309">------------------</text>
    <text x="34" y="350">Цільова Windows     : C:\Windows (поточна/live)</text>
    <text x="34" y="390">Поточний SID        : S-1-5-21-1192589550-3551385280-887858436</text>
    <text x="34" y="430">Майбутній SID       : S-1-5-21-440389623-502372871-2993815481</text>
    <text x="34" y="484">Попередження про ризики</text>
    <text x="34" y="514">------------------------</text>
    <text x="34" y="555">- BitLocker має бути вимкнений/розшифрований на цільовому томі.</text>
    <text x="34" y="595">- Після запуску не входьте в систему та не вимикайте ПК.</text>
    <text x="34" y="649">етап:        підготовка автоматичної SYSTEM-транзакції</text>
    <text x="34" y="701">Продовжити зміну SID? Y/N [N]:</text>
  </g>
  <rect x="438" y="678" width="12" height="27" fill="#f2f2f2"/>
</svg>
