<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Current SID Forge console screen before launch</title>
  <desc id="desc">Summary with the current and future SID and the launch confirmation</desc>
  <rect width="1280" height="760" fill="#0c0c0c"/>
  <rect width="1280" height="44" fill="#202020"/>
  <rect x="16" y="12" width="18" height="18" fill="none" stroke="#f2f2f2" stroke-width="2"/>
  <text x="48" y="29" fill="#f4f4f4" font-family="Segoe UI,Arial,sans-serif" font-size="16">SID Forge</text>
  <g fill="#f2f2f2" font-family="Cascadia Mono,Consolas,monospace" font-size="21">
    <text x="34" y="86">SID Forge automatic SID changer</text>
    <text x="34" y="116">===============================</text>
    <text x="34" y="165">This tool automatically changes the SID of the current Windows installation.</text>
    <text x="34" y="195">The change is performed by a one-time SYSTEM worker.</text>
    <text x="34" y="225">The computer may restart once or twice.</text>
    <text x="34" y="279">SID change summary</text>
    <text x="34" y="309">------------------</text>
    <text x="34" y="350">Target Windows      : C:\Windows (current/live)</text>
    <text x="34" y="390">Current SID         : S-1-5-21-1192589550-3551385280-887858436</text>
    <text x="34" y="430">Future SID          : S-1-5-21-440389623-502372871-2993815481</text>
    <text x="34" y="484">Risk warning</text>
    <text x="34" y="514">------------</text>
    <text x="34" y="555">- BitLocker must be off and the target volume fully decrypted.</text>
    <text x="34" y="595">- Do not sign in or turn off the PC after the transaction starts.</text>
    <text x="34" y="649">phase:       prepare automatic SYSTEM transaction</text>
    <text x="34" y="701">Continue with SID change? Y/N [N]:</text>
  </g>
  <rect x="484" y="678" width="12" height="27" fill="#f2f2f2"/>
</svg>
